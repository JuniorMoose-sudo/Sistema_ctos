# Backend Django (admin, API, app do técnico) — proxy para gunicorn na porta 8000
# O deploy.sh substitui <IP> pelo IP público da instância.
server {
    listen 80;
    server_name sistema.<IP>.nip.io;

    # Arquivos estáticos servidos direto pelo Nginx (mais rápido que whitenoise)
    location /static/ {
        alias /opt/sistema_ctos/backend/staticfiles/;
        expires 30d;
        access_log off;
    }

    # Uploads (fotos das ocorrências)
    location /media/ {
        alias /opt/sistema_ctos/backend/media/;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 20m;
    }
}
