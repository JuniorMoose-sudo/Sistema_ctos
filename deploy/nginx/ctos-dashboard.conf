# Dashboard Streamlit — proxy para 127.0.0.1:8501 (com WebSocket + Basic Auth)
# O deploy.sh substitui <IP> pelo IP público da instância.
server {
    listen 80;
    server_name dashboard.<IP>.nip.io;

    # Protege o dashboard com usuário/senha (arquivo criado pelo deploy.sh).
    auth_basic "Acesso restrito ao dashboard";
    auth_basic_user_file /etc/nginx/.htpasswd_sistema;

    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}
