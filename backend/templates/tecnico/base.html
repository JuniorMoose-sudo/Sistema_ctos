<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}App do Técnico - CTOs{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 text-gray-800 antialiased">
    <div class="max-w-md mx-auto bg-white min-h-screen shadow-xl flex flex-col justify-between">
        <!-- Header -->
        <header class="bg-blue-600 text-white p-4 shadow-md flex justify-between items-center sticky top-0 z-50">
            <h1 class="text-lg font-bold flex items-center gap-2">
                <i class="fa-solid fa-tower-broadcast"></i> CTO Campina Grande
            </h1>
            <div id="user-info" class="text-sm flex items-center gap-3">
                <span id="username-display"></span>
                <button onclick="logout()" class="bg-blue-700 hover:bg-blue-800 px-2.5 py-1 rounded text-xs transition">
                    <i class="fa-solid fa-right-from-bracket"></i> Sair
                </button>
            </div>
        </header>

        <!-- Content -->
        <main class="flex-1 p-4 pb-20">
            {% block content %}{% endblock %}
        </main>

        <!-- Footer / Nav -->
        <footer class="bg-white border-t border-gray-200 text-center py-3 text-xs text-gray-500 sticky bottom-0">
            ISP Campina Grande &copy; 2026 — Campo Mobile
        </footer>
    </div>

    <script>
        function checkAuth() {
            const token = localStorage.getItem('auth_token');
            const username = localStorage.getItem('username');
            const path = window.location.pathname;
            
            if (!token && !path.includes('/tecnico/login/')) {
                window.location.href = '/tecnico/login/';
            } else if (token && path.includes('/tecnico/login/')) {
                window.location.href = '/tecnico/';
            }
            
            if (username && document.getElementById('username-display')) {
                document.getElementById('username-display').textContent = username;
            }
        }

        function logout() {
            localStorage.removeItem('auth_token');
            localStorage.removeItem('username');
            window.location.href = '/tecnico/login/';
        }

        checkAuth();
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
