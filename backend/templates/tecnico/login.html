{% extends 'tecnico/base.html' %}

{% block title %}Login - App do Técnico{% endblock %}

{% block content %}
<div class="mt-12 px-2">
    <div class="text-center mb-8">
        <div class="bg-blue-100 text-blue-600 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
            <i class="fa-solid fa-user-gear"></i>
        </div>
        <h2 class="text-2xl font-bold text-gray-900">Acesso do Técnico</h2>
        <p class="text-sm text-gray-500 mt-1">Entre com suas credenciais de campo</p>
    </div>

    <form id="login-form" class="space-y-4" onsubmit="handleLogin(event)">
        <div id="error-alert" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded text-sm"></div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Usuário</label>
            <div class="relative">
                <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                    <i class="fa-solid fa-user"></i>
                </span>
                <input type="text" id="username" required class="w-full pl-10 pr-3 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm" placeholder="Ex: joao.silva">
            </div>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Senha</label>
            <div class="relative">
                <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                    <i class="fa-solid fa-lock"></i>
                </span>
                <input type="password" id="password" required class="w-full pl-10 pr-3 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm" placeholder="••••••••">
            </div>
        </div>

        <button type="submit" id="submit-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg shadow transition flex items-center justify-center gap-2">
            <span>Entrar no Sistema</span>
            <i class="fa-solid fa-arrow-right"></i>
        </button>
    </form>
</div>
{% endblock %}

{% block scripts %}
<script>
async function handleLogin(event) {
    event.preventDefault();
    const usernameInput = document.getElementById('username').value.trim();
    const passwordInput = document.getElementById('password').value;
    const errorAlert = document.getElementById('error-alert');
    const submitBtn = document.getElementById('submit-btn');

    errorAlert.classList.add('hidden');
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Entrando...';

    try {
        const response = await fetch('/api/auth/token/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ username: usernameInput, password: passwordInput })
        });

        if (!response.ok) {
            throw new Error('Usuário ou senha inválidos.');
        }

        const data = await response.json();
        localStorage.setItem('auth_token', data.token);
        localStorage.setItem('username', usernameInput);
        window.location.href = '/tecnico/';
    } catch (err) {
        errorAlert.textContent = err.message || 'Erro ao realizar login.';
        errorAlert.classList.remove('hidden');
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>Entrar no Sistema</span> <i class="fa-solid fa-arrow-right"></i>';
    }
}
</script>
{% endblock %}
